name: Build and deploy PhotoCraft Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocraft-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CRAFT_I18N_REQUIRED: "1"
      CRAFT_I18N_DIR: ${{ github.workspace }}/.cache/craft-i18n
      # The same Trunk version PhotoCraft's own CI and release workflow pin (ci.yml,
      # TRUNK_VERSION). A newer Trunk can generate a loader that no longer matches the page,
      # and a page served with a different build is what leaves "Loading PhotoCraft…" on
      # screen forever.
      TRUNK_VERSION: 0.21.14
      PHOTOCRAFT_WEB_WASM_OPT_CONVERGE: "0"
    steps:
      - name: Checkout PhotoCraft
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build files
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev binaryen gzip zip unzip

      - name: Install Trunk (pinned, matching PhotoCraft's CI)
        run: cargo install trunk --locked --version "$TRUNK_VERSION"

      - name: Get the exact PhotoCraft translation catalogs
        run: |
          mkdir -p .cache
          git clone https://github.com/storytold/craft-i18n.git "$CRAFT_I18N_DIR"
          git -C "$CRAFT_I18N_DIR" checkout --detach "$(tr -d '[:space:]' < craft-i18n.rev)"

      - name: Build and package the complete WebAssembly website
        run: packaging/web/package.sh

      - name: Extract the deployable static website
        run: |
          mkdir -p public
          package_zip="$(find dist -maxdepth 1 -type f -name 'photocraft-web-*.zip' -print -quit)"
          test -n "$package_zip"
          unzip -q "$package_zip" -d public-extracted
          site_dir="$(find public-extracted -mindepth 1 -maxdepth 1 -type d -name 'photocraft-web-*' -print -quit)"
          test -n "$site_dir"
          cp -a "$site_dir/." public/
          test -s public/index.html
          test -s public/_headers
          test -s public/app/parts.txt
          # The page boots only when every piece below is really there. A site that misses
          # one of them is what shows "Loading PhotoCraft…" forever, so fail the workflow
          # here instead of deploying it.
          test -s public/app/photocraft-web.js
          boot_js="$(find public -maxdepth 1 -type f -name 'photocraft-web-boot-*.js' -print -quit)"
          boot_wasm="$(find public -maxdepth 1 -type f -name 'photocraft-web-boot-*_bg.wasm' -print -quit)"
          test -n "$boot_js" && test -s "$boot_js"
          test -n "$boot_wasm" && test -s "$boot_wasm"
          first_part="$(sed -n '2p' public/app/parts.txt | tr -d '[:space:]')"
          test -n "$first_part" && test -s "public/app/$first_part"
          echo "Site pieces verified (index.html, _headers, boot module, app glue, parts)."
          echo "Deployable site prepared: $(du -sh public | cut -f1)"

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-cloudflare-pages
          path: public/
          if-no-files-found: error
          retention-days: 14
          # v4 hides dotfiles by default; the Cloudflare Pages header rules live in the
          # dotfile `_headers`, so it must be included explicitly or the deployed site
          # loses the WebAssembly MIME type and caching rules.
          include-hidden-files: true

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured. Build artifact is ready; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions Secrets to enable deployment."
            exit 0
          fi
          npx --yes wrangler@4 pages project create photocraft-full --production-branch main || true
          npx --yes wrangler@4 pages deploy public --project-name photocraft-full --branch main

      - name: Verify the deployed website starts
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; skipping the deployed-site check."
            exit 0
          fi
          # The boot module fetches ./app/parts.txt first. If the deployed site can't serve
          # it, a visitor is left on "Loading PhotoCraft…" — check it right after deploying.
          sleep 15
          parts_url="https://photocraft-full.pages.dev/app/parts.txt"
          parts="$(curl -fsSL --retry 5 --retry-delay 5 "$parts_url")" || {
            echo "WARNING: $parts_url is not reachable yet; open the site and check the browser console." >&2
            exit 0
          }
          echo "$parts" | grep -q '^photocraft-parts 1$' || {
            echo "WARNING: $parts_url does not look like a parts list; the deployed site may be an older or broken build." >&2
            exit 0
          }
          echo "Deployed site check passed: $parts_url"
          echo "$parts"
          
